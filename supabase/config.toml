[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["micro://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true


[edge_runtime]
enabled = true
policy = "per_worker"

[functions.stake]
enabled = true

[functions.resolve]
enabled = true

[functions.settle]
enabled = true
# Invoked by pg_cron every hour to finalize markets past the dispute window
verify_jwt = false
